<style>
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
        .bg-mesh {
            background-color: #f8f9fa;
            background-image: 
                radial-gradient(at 0% 0%, #bfe8ff 0px, transparent 50%),
                radial-gradient(at 100% 0%, #ffd9de 0px, transparent 50%),
                radial-gradient(at 100% 100%, #ebdcff 0px, transparent 50%),
                radial-gradient(at 0% 100%, #f5adb8 0px, transparent 50%);
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-mesh min-h-screen flex flex-col items-center justify-between overflow-hidden">
<!-- Decorative Top Element -->
<div class="w-full h-1/4 opacity-30"></div>
<!-- Main Content Area -->
<div class="flex flex-col items-center justify-center flex-grow gap-8 animate-float">
<!-- Logo Container -->
<div class="w-32 h-32 md:w-40 md:h-40 glass-effect rounded-xl flex items-center justify-center shadow-lg transform rotate-3">
<div class="w-24 h-24 md:w-32 md:h-32 bg-gradient-to-br from-primary to-secondary rounded-[2rem] flex items-center justify-center shadow-inner">
<span class="material-symbols-outlined text-on-primary text-5xl md:text-6xl" data-icon="school" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
</div>
<!-- Typography Section -->
<div class="text-center px-6">
<h1 class="text-on-surface font-display-lg-mobile md:text-display-lg mb-2 tracking-tight">
                EduLoop
            </h1>
<p class="text-on-surface-variant font-body-lg md:text-headline-md tracking-tight opacity-80">
                Marketplace Pelajar &amp; Mahasiswa
            </p>
</div>
</div>
<!-- Bottom Loading Section -->
<div class="w-full max-w-xs flex flex-col items-center gap-6 pb-xl px-md">
<div class="w-full bg-white/20 h-2 rounded-full overflow-hidden backdrop-blur-sm">
<div class="h-full bg-primary rounded-full w-0 transition-all duration-300 ease-out shadow-[0_0_12px_rgba(0,102,133,0.4)]" id="progress-bar"></div>
</div>
<div class="flex items-center gap-2 text-on-surface-variant font-label-md">
<span class="material-symbols-outlined animate-spin text-primary" data-icon="progress_activity">progress_activity</span>
<span id="loading-text">Menyiapkan inspirasi...</span>
</div>
</div>
<!-- Background Atmospheric Illustrations (Abstract) -->
<div class="absolute -z-10 top-20 -left-10 w-64 h-64 bg-primary-container/30 rounded-full blur-[80px]"></div>
<div class="absolute -z-10 bottom-40 -right-10 w-80 h-80 bg-tertiary-container/30 rounded-full blur-[100px]"></div>
<script>
        // Progress Bar and Text Micro-interaction
        const progressBar = document.getElementById('progress-bar');
        const loadingText = document.getElementById('loading-text');
        const messages = [
            "Menghubungkan antar mahasiswa...",
            "Mencari barang berkualitas...",
            "Menyusun marketplace kamu...",
            "Hampir sampai..."
        ];

        let progress = 0;
        let messageIndex = 0;

        const updateLoading = () => {
            if (progress < 100) {
                progress += Math.random() * 8;
                if (progress > 100) progress = 100;
                progressBar.style.width = `${progress}%`;

                // Update text every 25%
                if (progress > (messageIndex + 1) * 25 && messageIndex < messages.length - 1) {
                    messageIndex++;
                    loadingText.style.opacity = '0';
                    setTimeout(() => {
                        loadingText.innerText = messages[messageIndex];
                        loadingText.style.opacity = '1';
                    }, 300);
                }

                setTimeout(updateLoading, 200 + Math.random() * 300);
            } else {
                // Potential Redirect Logic here
                loadingText.innerText = "Selamat datang!";
                setTimeout(() => {
                    document.body.style.opacity = '0';
                    document.body.style.transition = 'opacity 0.8s ease';
                }, 500);
            }
        };

        // Initial trigger
        window.addEventListener('load', () => {
            setTimeout(updateLoading, 500);
        });

        // Soft interaction for the logo
        const logo = document.querySelector('.animate-float');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
            logo.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
    </script>
</body></html>
