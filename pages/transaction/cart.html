<!doctype html>
<html class="light" lang="id">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>EduLoop - Keranjang Belanja</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#6366F1",
              "on-primary": "#FFFFFF",
              "primary-container": "#E0E7FF",
              "on-primary-container": "#1E1B4B",
              secondary: "#0EA5E9",
              "on-secondary": "#FFFFFF",
              surface: "#FDFDFF",
              "on-surface": "#1E293B",
              "surface-variant": "#F1F5F9",
              "on-surface-variant": "#64748B",
              outline: "#CBD5E1",
              error: "#EF4444",
            },
            borderRadius: {
              DEFAULT: "0.5rem",
              lg: "1rem",
              xl: "1.5rem",
              "2xl": "2rem",
              full: "9999px",
            },
            fontFamily: {
              headline: ["Public Sans", "sans-serif"],
              display: ["Public Sans", "sans-serif"],
              body: ["Public Sans", "sans-serif"],
              label: ["Public Sans", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Public Sans", sans-serif;
        background-color: #f8fafc;
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .shadow-soft {
        box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      }
      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
    </style>
  </head>
  <body class="text-on-surface antialiased pb-32">
    <!-- Top App Bar -->
    <header
      class="fixed top-0 w-full z-50 bg-surface/70 dark:bg-surface-dim/70 backdrop-blur-xl shadow-sm h-16 flex items-center"
    >
      <div
        class="flex items-center justify-between px-6 w-full max-w-container-max mx-auto"
      >
        <div class="flex items-center gap-4">
          <button
            id="back-button"
            class="active:scale-95 transition-transform hover:opacity-80"
          >
            <span class="material-symbols-outlined text-primary text-2xl">
              arrow_back
            </span>
          </button>
          <h1
            class="font-headline font-bold text-xl tracking-tight text-on-surface"
          >
            Keranjang
          </h1>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-on-surface-variant text-sm font-medium"
            >3 Item</span
          >
        </div>
      </div>
    </header>
    <main class="pt-24 px-6 max-w-2xl mx-auto space-y-6">
      <div id="cart-items" class="space-y-6"></div>
      <!-- Promo Section -->
      <div
        class="bg-primary-container/30 border border-primary/20 rounded-2xl p-4 flex items-center justify-between"
      >
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined text-primary">sell</span>
          <span class="text-sm font-medium text-on-primary-container"
            >Gunakan kode promo</span
          >
        </div>
        <span class="material-symbols-outlined text-primary"
          >chevron_right</span
        >
      </div>
    </main>
    <!-- Bottom Sticky Checkout -->
    <div
      class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-2xl border-t border-outline/10 px-6 pt-6 pb-safe z-50 rounded-t-3xl shadow-[0_-10px_30px_-5px_rgba(0,0,0,0.05)]"
    >
      <div class="max-w-2xl mx-auto">
        <div class="flex items-center justify-between mb-6">
          <div>
            <div class="text-on-surface-variant text-xs font-medium">
              Subtotal Pesanan
            </div>
            <div id="subtotal" class="text-2xl font-extrabold text-on-surface">
              Rp 0
            </div>
          </div>
          <div class="text-right">
            <div
              class="text-on-surface-variant text-[10px] bg-surface-variant px-2 py-0.5 rounded-full inline-block"
            >
              Termasuk Pajak
            </div>
          </div>
        </div>
        <button
          id="checkout-button"
          class="w-full bg-primary hover:bg-primary/90 text-on-primary font-bold py-4 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-primary/20 active:scale-[0.98] transition-all"
        >
          <span class="">Checkout Sekarang</span>
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>
      </div>
    </div>
    <!-- Bottom Nav Bar (Shared Component Context) -->
    <!-- Suppressed due to being a Transactional/Linear task page focused on Cart -->
    <script>
      // =========================
      // Load Cart Data
      // =========================

      const product = JSON.parse(localStorage.getItem("eduloop_cart"));

      const cartItems = document.getElementById("cart-items");

      const subtotal = document.getElementById("subtotal");

      const itemCount = document.querySelector(
        "header span.text-on-surface-variant",
      );

      // =========================
      // Render Cart
      // =========================

      if (product) {
        cartItems.innerHTML = `

    <div class="glass-card shadow-soft rounded-2xl p-4 flex gap-4 items-center">


        <img
        src="${product.image}"
        class="w-24 h-24 rounded-xl object-cover">


        <div class="flex-1">


            <h3 class="font-bold text-on-surface">
                ${product.name}
            </h3>


            <p class="text-sm text-gray-500 mt-1">
                ${product.seller || "Mahasiswa EduLoop"}
            </p>



            <div class="mt-3 flex justify-between items-center">


                <span class="font-bold text-primary">
                    ${product.price}
                </span>


                <span class="bg-primary/10 text-primary px-3 py-1 rounded-full text-sm">
                    Qty 1
                </span>


            </div>


        </div>


    </div>

    `;

        subtotal.textContent = product.price;

        if (itemCount) {
          itemCount.textContent = "1 Item";
        }
      } else {
        cartItems.innerHTML = `

    <div class="text-center py-16">


        <span class="material-symbols-outlined text-6xl text-gray-300">
            shopping_cart
        </span>


        <p class="mt-4 text-gray-500">
            Keranjang masih kosong
        </p>


    </div>

    `;

        subtotal.textContent = "Rp 0";
      }

      // =========================
      // Back Button
      // =========================

      document.getElementById("back-button").onclick = function () {
        window.location.href = "../marketplace/detail_product.html";
      };

      // =========================
      // Checkout Button
      // =========================

      document.getElementById("checkout-button").onclick = function () {
        if (!product) {
          alert("Keranjang masih kosong");

          return;
        }

        // Simpan data checkout

        localStorage.setItem("eduloop_checkout", JSON.stringify(product));

        // menuju pembayaran

        window.location.href = "payment.html";
      };
    </script>
  </body>
</html>
